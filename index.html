<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSA Audit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticky top bar with four views; cards on a cool grey field; orange is reserved for actions and "look here" highlights. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F8; --ink:#1C2024; --muted:#5B636D; --line:#DADEE3;
  --accent:#D45F1C; --accent-soft:#FCEBDF; --accent-ink:#963F0E;
  --high:#A2343B; --high-soft:#F6E2E3; --med:#86680F; --med-soft:#F3ECD5; --low:#3D6B57; --low-soft:#E0EDE6;
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,24,28,.05), 0 4px 14px rgba(20,24,28,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171A; --surface:#1C2024; --surface-2:#22272C; --ink:#E6E8EA; --muted:#9BA3AC; --line:#30363C;
    --accent:#F0803F; --accent-soft:#3A2416; --accent-ink:#F7A574;
    --high:#E58389; --high-soft:#3A2023; --med:#D9B85A; --med-soft:#332B16; --low:#80C2A2; --low-soft:#1C3128;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --surface-2:#22272C; --ink:#E6E8EA; --muted:#9BA3AC; --line:#30363C;
  --accent:#F0803F; --accent-soft:#3A2416; --accent-ink:#F7A574;
  --high:#E58389; --high-soft:#3A2023; --med:#D9B85A; --med-soft:#332B16; --low:#80C2A2; --low-soft:#1C3128;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:14px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:14px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:9px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:16px}
nav a:hover{color:var(--ink);background:var(--surface)}
nav a[aria-current="page"]{background:var(--ink);color:var(--surface)}
main{max-width:1320px;margin:0 auto;padding:24px 24px 80px;display:flex;flex-direction:column;gap:20px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head p{margin:0;color:var(--muted);font-size:15px}
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:960px){.g2{grid-template-columns:1fr}}
.stat .label{font-size:15px;color:var(--muted);font-weight:500}
.stat .value{font-size:34px;font-weight:600;margin-top:4px;line-height:1.1}
.stat .sub{font-size:14px;color:var(--muted);margin-top:6px}
.stat.accent{border-color:var(--accent)}
.stat.accent .value{color:var(--accent-ink)}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;font-size:16px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--high)}
.btn.sm{padding:6px 12px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.High{background:var(--high-soft);color:var(--high)}
.chip.Medium{background:var(--med-soft);color:var(--med)}
.chip.Low{background:var(--low-soft);color:var(--low)}
.chip.p{background:var(--ink);color:var(--surface)}
.chip.cat{background:var(--surface-2);color:var(--muted);border-color:var(--line);font-weight:500}
.chip.status{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.chip.status.s-confirmed{border-color:var(--high);color:var(--high)}
.chip.status.s-cleared{border-color:var(--low);color:var(--low)}
.chip.ref{background:transparent;border-color:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-weight:500;font-size:13.5px;cursor:pointer}
.chip.ref:hover{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* issue cards */
.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
@media (max-width:440px){.issues{grid-template-columns:1fr}}
.icard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 18px 26px;cursor:pointer;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);text-align:left;width:100%}
.icard:hover{border-color:var(--muted)}
.icard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--sev)}
.icard[data-risk="High"]{--sev:var(--high)} .icard[data-risk="Medium"]{--sev:var(--med)} .icard[data-risk="Low"]{--sev:var(--low)}
.icard.cleared{opacity:.6}
.icard .t{font-size:18.5px;font-weight:600;line-height:1.3}
.icard .amt{font-size:26px;font-weight:600;line-height:1}
.icard .amt small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--font);margin-left:6px}
.icard .where{font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere;min-width:0}
.icard .where b{color:var(--ink);font-weight:500}
.icard .id{font-family:var(--mono);font-size:13.5px;color:var(--muted)}
.icard .tophead{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* toolbar */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;min-width:0}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* matrix */
table{border-collapse:collapse;width:100%}
.matrix th,.matrix td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.matrix th{font-size:14px;color:var(--muted);font-weight:500}
.matrix td.c{text-align:center;width:88px}
.mcell{display:inline-flex;min-width:40px;justify-content:center;padding:4px 10px;border-radius:8px;font-weight:600;cursor:pointer;border:0;font-family:var(--mono)}
.mcell.zero{color:var(--muted);background:transparent;font-weight:400;cursor:default}
.mcell.High{background:var(--high-soft);color:var(--high)} .mcell.Medium{background:var(--med-soft);color:var(--med)} .mcell.Low{background:var(--low-soft);color:var(--low)}

/* bar */
.bar{position:relative;height:14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:visible;margin:14px 0 30px}
.bar .fill{height:100%;border-radius:999px;background:var(--accent)}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.bar .mark span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);white-space:nowrap}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:34px 24px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:19px;display:block;margin-bottom:4px}
.files{display:grid;gap:12px}
.fileitem{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.fileitem.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sheets{display:flex;gap:6px;flex-wrap:wrap}
.maprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* data grid */
.gridwrap{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:12px}
.dg{font-size:15px;min-width:100%}
.dg th,.dg td{padding:7px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:left}
.dg thead th{position:sticky;top:0;background:var(--surface-2);z-index:1;font-weight:600;font-size:14px}
.dg thead th .cl{display:block;font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12px}
.dg td.rn,.dg th.rn{font-family:var(--mono);color:var(--muted);text-align:right;background:var(--surface-2);position:sticky;left:0}
.dg td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.dg tr.hit td{background:var(--accent-soft)}
.dg tr.hit td.rn{color:var(--accent-ink);font-weight:600;box-shadow:inset 4px 0 0 var(--accent)}
.dg td.hitcell{outline:2px solid var(--accent);outline-offset:-2px;font-weight:600;color:var(--accent-ink)}
.dg tr.focus td{animation:pulse 1.6s ease 1}
@keyframes pulse{0%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{background:var(--accent-soft)}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.38);z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:41;overflow:auto;transform:translateX(100%);transition:transform .2s ease;border-left:1px solid var(--line)}
.drawer.open{transform:none}
.drawer-in{padding:22px 26px 60px;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead h2{font-size:25px}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted);font-size:15px}
dl.kv dd{margin:0}
@media (max-width:560px){dl.kv{grid-template-columns:1fr} dl.kv dt{margin-top:6px}}
.std{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.std-h{padding:12px 16px;background:var(--surface-2);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.std-h b{font-family:var(--mono);font-weight:600}
.std-h span{color:var(--muted);font-size:15px}
.para{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:16px;color:var(--muted)}
.para .pn{font-family:var(--mono);font-size:14px;padding-top:2px}
.para.hit{background:var(--accent-soft);color:var(--ink);box-shadow:inset 5px 0 0 var(--accent)}
.para.hit .pn{color:var(--accent-ink);font-weight:600}
.para .tag{display:inline-block;margin-left:8px;font-size:12.5px;font-weight:600;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.04em}
.callout{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:16px}
.note{font-size:14px;color:var(--muted)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
@media (max-width:600px){.lib{grid-template-columns:1fr}}

/* modal + toast */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:rgba(10,12,14,.38);padding:16px}
.modal.open{display:flex}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:12px;z-index:80;font-size:16px;display:none;max-width:min(560px,92vw)}
.toast.show{display:block}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.sample-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink);border-radius:var(--r);padding:12px 18px;font-size:16px}
.list-plain{margin:0;padding-left:20px}
.list-plain li{margin:4px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){main{padding:16px 16px 60px}.top-in{padding:12px 16px}.card{padding:18px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>SSA Audit Tracker</b><span id="engLine">—</span></div>
    <nav id="nav">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#issues" data-v="issues">Issues</a>
      <a href="#files" data-v="files">Files &amp; testing</a>
      <a href="#references" data-v="references">SSA / SFRS(I) library</a>
    </nav>
  </div>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Issue detail"></aside>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============================================================
   Reference library. Paragraph text is paraphrased for quick
   orientation; always read the official SSA / SFRS(I) text.
   ============================================================ */
const LIB = {
 "SSA 200":{kind:"SSA",title:"Overall Objectives of the Independent Auditor and the Conduct of an Audit in Accordance with SSAs",paras:[
  ["15","Plan and perform the audit with professional scepticism, recognising that circumstances may exist that cause the financial statements to be materially misstated."],
  ["17","Obtain sufficient appropriate audit evidence to reduce audit risk to an acceptably low level, so reasonable conclusions can be drawn to support the opinion."]]},
 "SSA 230":{kind:"SSA",title:"Audit Documentation",paras:[
  ["8","Prepare documentation that lets an experienced auditor with no prior connection to the audit understand the procedures performed, the evidence obtained and significant matters and judgements."],
  ["9","When documenting procedures, record the identifying characteristics of the specific items or matters tested."]]},
 "SSA 240":{kind:"SSA",title:"The Auditor's Responsibilities Relating to Fraud in an Audit of Financial Statements",paras:[
  ["12","Maintain professional scepticism throughout the audit, recognising that fraud could exist despite past experience of management's honesty and integrity."],
  ["26","Presume there are risks of fraud in revenue recognition, and evaluate which types of revenue, transactions or assertions give rise to those risks."],
  ["31","Treat management override of controls as a risk of material misstatement due to fraud, and therefore a significant risk, in every audit."],
  ["32(a)","Design and perform procedures to test the appropriateness of journal entries recorded in the general ledger and other adjustments made in preparing the financial statements."],
  ["32(a)(ii)","Select journal entries and other adjustments made at the end of the reporting period."],
  ["32(a)(iii)","Consider the need to test journal entries and other adjustments throughout the period."],
  ["32(b)","Review accounting estimates for bias and evaluate whether the circumstances producing the bias represent a risk of material misstatement due to fraud."],
  ["32(c)","For significant transactions outside the normal course of business, evaluate whether the business rationale suggests they were entered into for fraudulent financial reporting or to conceal misappropriation."],
  ["A42–A43","Characteristics of fraudulent journal entries include: entries to unrelated, unusual or seldom-used accounts; entries by people who do not usually post journals; entries at period end or post-closing with little or no explanation; entries without account numbers; and entries with round or consistent ending numbers."]]},
 "SSA 315":{kind:"SSA",title:"Identifying and Assessing the Risks of Material Misstatement (Revised 2019)",paras:[
  ["28","Identify the risks of material misstatement and determine whether they exist at the financial statement level or the assertion level."],
  ["31","For risks at the assertion level, assess inherent risk by considering the likelihood and magnitude of misstatement."],
  ["32","Determine whether any of the assessed risks of material misstatement are significant risks."]]},
 "SSA 320":{kind:"SSA",title:"Materiality in Planning and Performing an Audit",paras:[
  ["10","Determine materiality for the financial statements as a whole when establishing the overall audit strategy."],
  ["11","Determine performance materiality for assessing risks and setting the nature, timing and extent of further audit procedures."],
  ["12","Revise materiality if information becomes available during the audit that would have led to a different amount initially."]]},
 "SSA 330":{kind:"SSA",title:"The Auditor's Responses to Assessed Risks",paras:[
  ["18","Irrespective of assessed risks, design and perform substantive procedures for each material class of transactions, account balance and disclosure."],
  ["20(a)","Agree or reconcile the information in the financial statements with the underlying accounting records."],
  ["20(b)","Examine material journal entries and other adjustments made in the course of preparing the financial statements."],
  ["21","Where a risk is assessed as significant, perform substantive procedures that respond specifically to that risk."]]},
 "SSA 450":{kind:"SSA",title:"Evaluation of Misstatements Identified during the Audit",paras:[
  ["5","Accumulate misstatements identified during the audit, other than those that are clearly trivial."],
  ["8","Communicate all accumulated misstatements on a timely basis to the appropriate level of management and request that they be corrected."],
  ["11","Determine whether uncorrected misstatements are material, individually or in aggregate."]]},
 "SSA 500":{kind:"SSA",title:"Audit Evidence",paras:[
  ["6","Design and perform audit procedures that are appropriate for obtaining sufficient appropriate audit evidence."],
  ["7","Consider the relevance and reliability of the information to be used as audit evidence."],
  ["9","When using information produced by the entity, evaluate whether it is sufficiently reliable, including obtaining evidence about its accuracy and completeness."],
  ["10","Determine means of selecting items for testing that are effective in meeting the purpose of the procedure (all items, specific items, or audit sampling)."],
  ["11","If evidence from different sources is inconsistent, or its reliability is in doubt, determine what changes or additions to procedures are needed."]]},
 "SSA 501":{kind:"SSA",title:"Audit Evidence — Specific Considerations for Selected Items",paras:[
  ["4","Where inventory is material, attend the physical inventory count (unless impracticable) and perform procedures on the final inventory records."]]},
 "SSA 520":{kind:"SSA",title:"Analytical Procedures",paras:[
  ["5","For substantive analytical procedures, assess suitability for the assertions, the reliability of the data, and develop an expectation precise enough to identify misstatement."],
  ["7","Investigate fluctuations or relationships that are inconsistent with other information or differ significantly from expected values."]]},
 "SSA 530":{kind:"SSA",title:"Audit Sampling",paras:[
  ["7","Determine a sample size sufficient to reduce sampling risk to an acceptably low level."],
  ["9","Perform audit procedures appropriate to the purpose on each item selected."]]},
 "SSA 540":{kind:"SSA",title:"Auditing Accounting Estimates and Related Disclosures (Revised)",paras:[
  ["16","Assess inherent risk for accounting estimates, taking into account estimation uncertainty, complexity and subjectivity."],
  ["32","Evaluate whether judgements and decisions made by management in making estimates indicate possible management bias."]]},
 "SSA 550":{kind:"SSA",title:"Related Parties",paras:[
  ["15","Remain alert, when inspecting records or documents, for arrangements or information that may indicate related party relationships or transactions not previously identified."],
  ["23","For significant related party transactions outside the normal course of business, inspect the underlying agreements and evaluate the business rationale."],
  ["25","Evaluate whether identified related party relationships and transactions have been appropriately accounted for and disclosed."]]},
 "SSA 560":{kind:"SSA",title:"Subsequent Events",paras:[
  ["6","Perform procedures to obtain evidence that all events between the date of the financial statements and the auditor's report that need adjustment or disclosure have been identified."]]},
 "SFRS(I) 1-1":{kind:"SFRS(I)",title:"Presentation of Financial Statements",paras:[
  ["15","Financial statements shall present fairly the financial position, financial performance and cash flows of the entity."],
  ["29","Present each material class of similar items separately; present items of a dissimilar nature or function separately unless immaterial."],
  ["32","Do not offset assets and liabilities, or income and expenses, unless required or permitted by an SFRS(I)."]]},
 "SFRS(I) 1-2":{kind:"SFRS(I)",title:"Inventories",paras:[
  ["9","Inventories are measured at the lower of cost and net realisable value."]]},
 "SFRS(I) 1-8":{kind:"SFRS(I)",title:"Accounting Policies, Changes in Accounting Estimates and Errors",paras:[
  ["41","Financial statements do not comply with SFRS(I) if they contain material errors, or immaterial errors made intentionally to achieve a particular presentation."],
  ["42","Correct material prior period errors retrospectively in the first set of financial statements authorised after their discovery."]]},
 "SFRS(I) 1-10":{kind:"SFRS(I)",title:"Events after the Reporting Period",paras:[
  ["8","Adjust the amounts recognised to reflect adjusting events after the reporting period."],
  ["21","Disclose the nature and financial effect of material non-adjusting events after the reporting period."]]},
 "SFRS(I) 1-24":{kind:"SFRS(I)",title:"Related Party Disclosures",paras:[
  ["18","Where there have been related party transactions, disclose the nature of the relationship and information about the transactions and outstanding balances, including commitments."]]},
 "SFRS(I) 1-37":{kind:"SFRS(I)",title:"Provisions, Contingent Liabilities and Contingent Assets",paras:[
  ["14","Recognise a provision only when there is a present obligation from a past event, an outflow of resources is probable, and a reliable estimate can be made."],
  ["36","The amount recognised is the best estimate of the expenditure required to settle the present obligation at the end of the reporting period."]]},

/* ===================== helpers ===================== */
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
function num(v){
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v === "boolean") return null;
  let s = String(v).trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1,-1); }
  s = s.replace(/[,\s]|S\$|SGD|\$/gi,"");
  if (/-$/.test(s)) { neg = true; s = s.slice(0,-1); }
  if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return null;
  const n = parseFloat(s); return isFinite(n) ? (neg ? -n : n) : null;
}
function toDate(v){
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Date.UTC(1899,11,30) + Math.round(v)*864e5);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);           // Singapore convention: d/m/y
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(Date.UTC(y, +m[2]-1, +m[1])); }
  m = s.match(/^(\d{1,2})[ -]([A-Za-z]{3,})[ -,]*(\d{2,4})$/);
  if (m) { const mo = "janfebmaraprmayjunjulaugsepoctnovdec".indexOf(m[2].slice(0,3).toLowerCase())/3; let y=+m[3]; if (y<100) y+=2000; if (mo>=0) return new Date(Date.UTC(y,mo,+m[1])); }
  return null;
}
const isoD = d => d ? d.toISOString().slice(0,10) : "";
const str = v => (v === null || v === undefined) ? "" : String(v).trim();
const colLetter = i => { let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; };

const S = () => state.settings;
const PM = () => S().om * S().pmPct/100;
const CT = () => S().om * S().ctPct/100;
const fmt = (n, dp=0) => (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toLocaleString("en-SG",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money = n => `${S().currency} ${fmt(n)}`;

/* ===================== column detection ===================== */
const FIELDS = [
 ["user",/posted by|prepared by|created by|entered by|preparer|\buser/i],
 ["date",/date|posting|period end/i],
 ["ref",/^(je|jnl|journal|voucher|doc|document|entry|txn|transaction|invoice)\b|\bref(erence)?\b|\bno\.?$/i],
 ["debit",/debit|^dr\b/i],
 ["credit",/credit|^cr\b/i],
 ["name",/(account|a\/c|gl|ledger)\s*(name|title|description)/i],
 ["account",/account|a\/c|\bgl\b|ledger|code/i],
 ["desc",/desc|narrat|memo|particular|detail|remark|text|explanation/i],
 ["amount",/amount|amt|balance|value|\bnet\b|sgd/i]
];
const FIELD_LABEL = {date:"Date",ref:"Reference / JE no.",account:"Account code",name:"Account name",desc:"Description",debit:"Debit",credit:"Credit",amount:"Amount (signed)",user:"Posted by"};
function detectHeader(aoa){
  let best = 0, bestScore = -Infinity;
  for (let r = 0; r < Math.min(15, aoa.length); r++){
    const row = aoa[r] || [];
    const texts = row.filter(v => typeof v === "string" && v.trim());
    if (texts.length < 2) continue;
    const kw = texts.filter(t => FIELDS.some(([,rx]) => rx.test(t))).length;
    const nums = row.filter(v => typeof v === "number").length;
    const score = kw*3 + texts.length - nums*2;
    if (score > bestScore){ best = r; bestScore = score; }
  }
  return best;
}
function detectMap(header){
  const map = {}; Object.keys(FIELD_LABEL).forEach(k => map[k] = -1);
  header.forEach((h,i) => {
    const t = str(h); if (!t) return;
    for (const [f,rx] of FIELDS){ if (map[f] === -1 && rx.test(t)){ map[f] = i; break; } }
  });
  return map;
}

/* ===================== parse uploads ===================== */
function normCell(v){
  if (v instanceof Date){
    let d = v; if (d.getHours() === 23 && d.getMinutes() >= 50) d = new Date(d.getTime() + 3600e3);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  if (typeof v === "number" || typeof v === "string") return v;
  if (v === null || v === undefined) return null;
  return String(v);
}
function parseWorkbook(buf, name){
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const file = {id:uid(), name, uploadedAt:new Date().toISOString(), sheets:[]};
  for (const sn of wb.SheetNames){
    const ws = wb.Sheets[sn]; if (!ws || !ws["!ref"]) continue;
    const range = XLSX.utils.decode_range(ws["!ref"]);
    const errors = [];
    for (const k in ws){
      if (k[0] === "!") continue;
      const c = ws[k];
      if (c && c.t === "e"){ const a = XLSX.utils.decode_cell(k); errors.push({addr:k, row:a.r+1, col:a.c - range.s.c, val:c.w || "#ERROR"}); }
    }
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true}).map(r => r.map(normCell));
    if (!aoa.length) continue;
    const hr = detectHeader(aoa);
    const width = Math.max(...aoa.slice(0,200).map(r => r.length), 1);
    const header = Array.from({length:width}, (_,i) => str((aoa[hr]||[])[i]) || colLetter(range.s.c+i));
    const rows = [], rowNums = [];
    errors.forEach(e => { /* make the error visible in the grid */
      const ri = e.row - 1 - range.s.r; if (aoa[ri]) aoa[ri][e.col] = e.val; });
    for (let r = hr+1; r < aoa.length; r++){
      const row = aoa[r]; if (!row || row.every(v => v === null || v === "")) continue;
      rows.push(row); rowNums.push(range.s.r + r + 1);
    }
    let truncated = false;
    if (rows.length > 20000){ rows.length = 20000; rowNums.length = 20000; truncated = true; }
    file.sheets.push({name:sn, headerRow:range.s.r+hr+1, header, colStart:range.s.c, rows, rowNums, map:detectMap(header), errors, truncated});
  }
  return file;
}

/* ===================== tests ===================== */
const RX_TOTAL = /^(grand\s+)?total|^sub-?total/i;
const RX_KEY = /\b(suspense|plug|manual|adj(ustment)?s?|reversal|reverse|write[- ]?offs?|override|misc(ellaneous)?|clearing|correction|top[- ]?side|unidentified)\b/i;
const RX_RP = /\b(director|shareholder|related part(y|ies)|holding co|parent co|subsidiar(y|ies)|associate|inter-?co(mpany)?|key management)\b/i;
const RX_EST = /\b(provision|allowance|impairment|doubtful|ecl|expected credit|accru(al|als|ed)|estimate|warranty)\b/i;
const RX_REV = /\b(revenue|sales|turnover)\b/i;
const BENFORD = [0, .301,.176,.125,.097,.079,.067,.058,.051,.046];

function rowsInfo(sh){
  const m = sh.map, out = [];
  sh.rows.forEach((r,i) => {
    const g = k => m[k] >= 0 ? r[m[k]] : null;
    const dr = num(g("debit")), cr = num(g("credit"));
    let amt = m.amount >= 0 ? num(g("amount")) : null;
    if (amt === null && (m.debit >= 0 || m.credit >= 0) && (dr !== null || cr !== null)) amt = (dr||0) - (cr||0);
    const name = str(g("name")), desc = str(g("desc")), acct = str(g("account"));
    const isTotal = r.some(v => typeof v === "string" && RX_TOTAL.test(v.trim()));
    out.push({i, n:sh.rowNums[i], amt, dr, cr, date:toDate(g("date")), acct, name, desc, ref:str(g("ref")), user:str(g("user")), text:(name+" "+desc).trim(), isTotal});
  });
  return out;
}
function sideAmount(rows){ let p=0, n=0; rows.forEach(r => { if (r.amt > 0) p += r.amt; else if (r.amt < 0) n -= r.amt; }); return Math.max(p,n); }

function runTests(file, sh){
  const m = sh.map, info = rowsInfo(sh).filter(r => !r.isTotal);
  const amtCols = [m.amount, m.debit, m.credit].filter(x => x >= 0);
  const hasAmt = amtCols.length > 0, hasDate = m.date >= 0, hasDrCr = m.debit >= 0 && m.credit >= 0;
  const fy = toDate(S().fyEnd), pm = PM(), ct = CT();
  const res = [];
  const add = (testId, rows, opts={}) => {
    if (!rows.length && !opts.force) return;
    res.push({testId, rows:rows.map(r => r.n), amount: opts.amount ?? sideAmount(rows), count: opts.count ?? rows.length, detail: opts.detail || "", cols: opts.cols || amtCols});
  };
  const withAmt = info.filter(r => r.amt !== null && r.amt !== 0);

  if (hasDrCr){
    const tdr = info.reduce((s,r) => s + (r.dr||0), 0), tcr = info.reduce((s,r) => s + (r.cr||0), 0);
    const diff = Math.round((tdr - tcr)*100)/100;
    if (Math.abs(diff) >= 0.5) add("tb_balance", [], {force:true, amount:Math.abs(diff), count:0, cols:[m.debit,m.credit],
      detail:`Total debits ${fmt(tdr,2)} vs total credits ${fmt(tcr,2)}; difference ${fmt(diff,2)}.`});
    if (m.ref >= 0){
      const g = {};
      info.forEach(r => { if (!r.ref) return; (g[r.ref] = g[r.ref] || []).push(r); });
      const bad = Object.entries(g).filter(([,rs]) => Math.abs(rs.reduce((s,r)=>s+(r.amt||0),0)) >= 0.5);
      if (bad.length) add("je_unbalanced", bad.flatMap(([,rs]) => rs), {
        amount: bad.reduce((s,[,rs]) => s + Math.abs(rs.reduce((t,r)=>t+(r.amt||0),0)), 0), count: bad.length,
        detail: bad.slice(0,12).map(([k,rs]) => `${k}: out by ${fmt(rs.reduce((t,r)=>t+(r.amt||0),0),2)}`).join("; "),
        cols:[m.ref, ...amtCols]});
    }
  }
  if (hasAmt && hasDate){
    add("large_items", withAmt.filter(r => Math.abs(r.amt) >= pm), {detail:`Threshold: performance materiality ${money(pm)}.`});
    add("round_amounts", withAmt.filter(r => Math.abs(r.amt) >= ct && Math.abs(r.amt) % 1000 === 0), {detail:`Exact thousands at or above clearly trivial (${money(ct)}).`});
    add("weekend", withAmt.filter(r => r.date && [0,6].includes(r.date.getUTCDay())), {cols:[m.date, ...amtCols], detail:"Dated Saturday or Sunday."});
    if (fy){
      const pe = withAmt.filter(r => r.date && r.date <= fy && (fy - r.date) <= 4*864e5 && Math.abs(r.amt) >= ct);
      add("period_end", pe, {cols:[m.date, ...amtCols], detail:`Dated ${isoD(new Date(fy-4*864e5))} to ${isoD(fy)}, at or above ${money(ct)}.`});
      add("post_ye", withAmt.filter(r => r.date && r.date > fy), {cols:[m.date, ...amtCols], detail:`Dated after the reporting date of ${isoD(fy)}.`});
      const rev = withAmt.filter(r => r.date && Math.abs(r.date - fy) <= 7*864e5 && (RX_REV.test(r.name) || /^4\d{3}$/.test(r.acct)));
      add("revenue_cutoff", rev, {cols:[m.date, m.account, m.name, ...amtCols].filter(x=>x>=0), detail:`Revenue-account lines dated within 7 days of ${isoD(fy)}.`});
    }
    const keyMap = {};
    withAmt.forEach(r => { const k = [isoD(r.date), r.acct, r.amt.toFixed(2), r.desc.toLowerCase()].join("|"); (keyMap[k] = keyMap[k] || []).push(r); });
    const dupGroups = Object.values(keyMap).filter(g => g.length > 1);
    if (dupGroups.length) add("duplicates", dupGroups.flat(), {amount: sideAmount(dupGroups.flatMap(g => g.slice(1))), count: dupGroups.length,
      detail:`${dupGroups.length} group(s) share date, account, amount and description. Amount shown is the potential overstatement (extra copies only).`});
    if (m.user >= 0 && info.length >= 30){
      const cnt = {}; info.forEach(r => { if (r.user) cnt[r.user] = (cnt[r.user]||0)+1; });
      const lim = Math.max(2, info.length*0.02);
      const rare = Object.keys(cnt).filter(u => cnt[u] <= lim);
      if (rare.length && Object.keys(cnt).length > rare.length) add("rare_users", withAmt.filter(r => rare.includes(r.user)), {cols:[m.user, ...amtCols],
        detail:`Users with ${Math.floor(lim)} or fewer lines: ${rare.map(u => `${u} (${cnt[u]})`).join(", ")}.`});
    }
    if (m.ref >= 0){
      const nums = [...new Set(info.map(r => { const x = r.ref.match(/(\d+)\s*$/); return x ? +x[1] : null; }).filter(x => x !== null))].sort((a,b)=>a-b);
      if (nums.length >= 10){
        const gaps = [];
        for (let k = 1; k < nums.length; k++){ const d = nums[k]-nums[k-1]; if (d > 1 && d <= 1000) gaps.push([nums[k-1], nums[k]]); }
        if (gaps.length){
          const before = new Set(gaps.map(g => g[0]));
          const rows = info.filter(r => { const x = r.ref.match(/(\d+)\s*$/); return x && before.has(+x[1]); });
          const missing = gaps.flatMap(([a,b]) => Array.from({length:Math.min(b-a-1,20)}, (_,j) => a+1+j));
          add("seq_gaps", rows, {amount:0, count:missing.length, cols:[m.ref], detail:`Missing number(s): ${missing.slice(0,40).join(", ")}${missing.length>40?" …":""}. Highlighted rows are the entries immediately before each gap.`});
        }
      }
    }
    const big = withAmt.filter(r => Math.abs(r.amt) >= 10 && (!hasDrCr || r.amt > 0)); // debit side only, so each journal counts once
    if (big.length >= 300){ // Benford is unreliable on small populations
      const c = Array(10).fill(0);
      big.forEach(r => { const d = +String(Math.abs(r.amt)).replace(/[^1-9]/,"").match(/[1-9]/)[0]; c[d]++; });
      const obs = c.map(x => x/big.length);
      const mad = obs.slice(1).reduce((s,o,i) => s + Math.abs(o - BENFORD[i+1]), 0) / 9;
      if (mad > 0.015){
        let dmax = 1; for (let d = 2; d <= 9; d++) if (obs[d]-BENFORD[d] > obs[dmax]-BENFORD[dmax]) dmax = d;
        add("benford", big.filter(r => String(Math.abs(r.amt)).match(/[1-9]/)[0] === String(dmax)), {amount:0,
          detail:`Mean absolute deviation ${mad.toFixed(4)} (above 0.015 suggests nonconformity). Leading digit ${dmax} appears ${(obs[dmax]*100).toFixed(1)}% vs expected ${(BENFORD[dmax]*100).toFixed(1)}%.`});
      }
    }
  }
  if (hasAmt){
    if (m.desc >= 0 || m.ref >= 0){
      const miss = withAmt.filter(r => (m.desc >= 0 && !r.desc) || (m.ref >= 0 && hasDate && !r.ref));
      add("missing_info", miss, {cols:[m.desc, m.ref].filter(x=>x>=0)});
    }
    add("keywords", withAmt.filter(r => RX_KEY.test(r.text)), {cols:[m.desc, m.name].filter(x=>x>=0)});
    add("related_party", withAmt.filter(r => RX_RP.test(r.text)), {cols:[m.desc, m.name].filter(x=>x>=0)});
    add("estimates", withAmt.filter(r => RX_EST.test(r.text) && Math.abs(r.amt) >= ct), {cols:[m.desc, m.name].filter(x=>x>=0)});
    if (!hasDate){
      const rules = [
        [/\b(cash|bank)\b/i, 1, "cash/bank in credit (overdraft shown net?)"],
        [/inventor|\bstock\b/i, 1, "negative inventory"],
        [/receivable|debtor/i, 1, "receivables in credit"],
        [/payable|creditor|accrued|accrual/i, -1, "liabilities in debit"]];
      const hits = [], notes = [];
      withAmt.forEach(r => {
        if (/allowance|provision|accumulated|impairment/i.test(r.text)) return;
        for (const [rx,sign,label] of rules){ if (rx.test(r.text) && Math.sign(r.amt) === -sign){ hits.push(r); notes.push(`row ${r.n}: ${r.name||r.desc||r.acct} — ${label}`); break; } }
      });
      add("sign_anomaly", hits, {amount: hits.reduce((s,r)=>s+Math.abs(r.amt),0), detail: notes.join("; ")});
    }
  }
  if (sh.errors && sh.errors.length){
    res.push({testId:"cell_errors", rows:[...new Set(sh.errors.map(e => e.row))], amount:0, count:sh.errors.length, cols:[...new Set(sh.errors.map(e => e.col))],
      detail: sh.errors.slice(0,20).map(e => `${e.addr} ${e.val}`).join(", ")});
  }
  return res;
}

function retest(fileIds){
  const ids = fileIds || state.files.map(f => f.id);
  const old = {};
  state.issues.forEach(i => { if (i.auto) old[i.key] = i; });
  state.issues = state.issues.filter(i => !i.auto || !ids.includes(i.loc.fileId));
  for (const f of state.files){
    if (!ids.includes(f.id)) continue;
    for (const sh of f.sheets){
      for (const r of runTests(f, sh)){
        const key = `${f.id}|${sh.name}|${r.testId}`, prev = old[key], T = TESTS[r.testId];
        state.issues.push({
          id: prev ? prev.id : state.seq++, key, auto:true, testId:r.testId, title:T.title, cat:T.cat,
          amount:r.amount, count:r.count, detail:r.detail,
          loc:{fileId:f.id, fileName:f.name, sheet:sh.name, rows:r.rows, cols:r.cols.filter(c => c >= 0)},
          refs: prev && prev.extraRefs ? T.refs.concat(prev.extraRefs) : T.refs.slice(), extraRefs: prev ? prev.extraRefs || [] : [],
          status: prev ? prev.status : "Open", prio: prev ? prev.prio : "", notes: prev ? prev.notes : "",
          created: prev ? prev.created : new Date().toISOString(), sample: !!f.sample
        });
      }
    }
  }
}

/* ===================== scoring ===================== */
function score(i){
  const w = (TESTS[i.testId] || TESTS.manual).w, a = Math.abs(i.amount || 0);
  const f = a >= S().om ? 3 : a >= PM() ? 2 : a >= CT() ? 1 : 0;
  return (i.wOverride ?? w) + f;
}
const riskOf = i => i.riskOverride || (score(i) >= 5 ? "High" : score(i) >= 3 ? "Medium" : "Low");
const prioOf = i => i.prio || ({High:"P1",Medium:"P2",Low:"P3"})[riskOf(i)];
const isActive = i => i.status !== "Cleared";
const issueNo = i => "AT-" + String(i.id).padStart(3,"0");
function refLabel(code, p){ return `${code}${p ? (code.startsWith("SFRS") ? " para " : ".") + p : ""}`; }

function sheetPanel(f, sh){
  const hits = new Map();
  state.issues.filter(i => i.loc.fileId===f.id && i.loc.sheet===sh.name && isActive(i)).forEach(i => i.loc.rows.forEach(n => { if (!hits.has(n)) hits.set(n, []); hits.get(n).push(i); }));

  let idx = sh.rows.map((_,i) => i);
  if (state.ui.flaggedOnly) idx = idx.filter(i => hits.has(sh.rowNums[i]));
  const LIM = 1500, shown = idx.slice(0, LIM);

  return `<div class="card">
    <div class="card-head"><h2>${esc(f.name)} › ${esc(sh.name)}</h2><p>Header found on Excel row ${sh.headerRow} · ${sh.rows.length} data rows${sh.truncated?" (first 20,000 kept)":""}</p></div>

    <div class="gridwrap"><table class="dg"><thead><tr><th class="rn">Row</th>${sh.header.map((h,i)=>`<th><span class="cl">${colLetter((sh.colStart||0)+i)}</span>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${shown.map(i => { const n = sh.rowNums[i], h = hits.get(n);

        return `<td class="${numCols.has(c) && typeof v==="number"?"n":""}">${typeof v==="number" && numCols.has(c) ? fmt(v,2) : esc(v ?? "")}</td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>

function bindFiles(){
  const drop = $("#drop"); if (!drop) return;
  drop.onclick = () => $("#fileInput").click();
  drop.onkeydown = e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); $("#fileInput").click(); } };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handleFiles(e.dataTransfer.files); };
  document.querySelectorAll("[data-map]").forEach(s => s.onchange = () => {
    const f = state.files.find(x => x.id === state.ui.fileId) || state.files[0];
    const sh = f.sheets.find(x => x.name === state.ui.sheet) || f.sheets[0];
    sh.map[s.dataset.map] = +s.value; retest([f.id]); save(); render(); toast("Mapping updated and tests re-run.");
  });
  const fo = $("#flaggedOnly"); if (fo) fo.onchange = () => { state.ui.flaggedOnly = fo.checked; save(); render(); };
  if (pendingRow){ const el = document.getElementById("r-"+pendingRow); if (el){ el.classList.add("focus"); el.scrollIntoView({block:"center"}); } pendingRow = null; }
}
let pendingRow = null;
async function handleFiles(list){
  if (typeof XLSX === "undefined"){ toast("The spreadsheet reader did not load. Check your connection and reload the page."); return; }
  let added = 0, before = state.issues.filter(i=>i.auto).length;
  for (const file of list){
    try {
      const buf = await file.arrayBuffer();
      const f = parseWorkbook(new Uint8Array(buf), file.name);
      if (!f.sheets.length){ toast(`${file.name} has no readable sheets.`); continue; }
      state.files.push(f); retest([f.id]); added++;
      state.ui.fileId = f.id; state.ui.sheet = f.sheets[0].name;
    } catch(err){ toast(`Could not read ${file.name}: ${err.message}`); }
  }
  if (added){ save(); render(); const n = state.issues.filter(i=>i.auto).length - before; toast(`${added} file(s) tested · ${n} issue(s) raised.`); }
  $("#fileInput").value = "";
}

/* ---- export ---- */
function issuesTable(sep){
  const q = v => { const s = String(v ?? ""); return sep === "," ? `"${s.replace(/"/g,'""')}"` : s.replace(/[\t\n\r]+/g," "); };
  const head = ["Ref","Title","Risk","Priority","Score","Category","Status","Amount","Currency","File","Sheet","Excel rows","Finding","Standards","Notes"];
  const body = sortedIssues(state.issues).map(i => [issueNo(i), i.title, riskOf(i), prioOf(i), score(i), i.cat, i.status, (i.amount||0).toFixed(2), S().currency,
    i.loc.fileName||"", i.loc.sheet||"", i.loc.rows.join(" "), i.detail||"", i.refs.map(([c,ps]) => ps.map(p => refLabel(c,p)).join("; ")).join("; "), i.notes||""]);
  return [head, ...body].map(r => r.map(q).join(sep)).join("\n");
}
async function exportCsv(){
  const data = "﻿" + issuesTable(",");
  try {
    const dl = window.claude && await window.claude.use("downloads");
    if (dl){ await dl.save({filename:`audit-issues-${new Date().toISOString().slice(0,10)}.csv`, data}); return; }
  } catch(e){ if (e && /declin|cancel|abort/i.test(String(e.message||e))) return; }
  if (!window.claude){ /* standalone hosting (e.g. Vercel): normal browser download */
    try {
      const url = URL.createObjectURL(new Blob([data], {type:"text/csv;charset=utf-8"}));
      const a = Object.assign(document.createElement("a"), {href:url, download:`audit-issues-${new Date().toISOString().slice(0,10)}.csv`});
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); return;
    } catch(_){}
  }
  copyOut(issuesTable("\t"), "Download is not available here, so the table was copied instead. Paste it into Excel.");
}
async function copyOut(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg || "Issue table copied. Paste it into Excel."); }
  catch(e){
    $("#modal").innerHTML = `<div class="card"><div class="card-head"><h2>Copy the issue table</h2><button class="btn ghost" data-act="modal-close" aria-label="Close">✕</button></div>
      <p class="muted" style="margin-top:0">Select all and copy, then paste into Excel.</p><textarea class="input" style="width:100%;min-height:300px;font-family:var(--mono);font-size:13px" readonly>${esc(text)}</textarea></div>`;
    $("#modal").classList.add("open"); $("#modal textarea").select();
  }
}

  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "open"){ e.stopPropagation(); openIssue(t.dataset.id); }
  else if (a === "close") closeDrawer();
  else if (a === "ref"){ e.stopPropagation(); refFocus = "p-"+slug(t.dataset.code)+"-"+slug(t.dataset.para); closeDrawer(); if (location.hash === "#references") render(); else location.hash = "references"; }
  else if (a === "filter"){ Object.assign(state.ui.filters, {cat:t.dataset.cat, risk:t.dataset.risk, status:"active", prio:"", q:""}); save(); location.hash = "issues"; }
  else if (a === "upload"){ location.hash = "files"; $("#fileInput").click(); }
  else if (a === "remove-sample"){ state.files = state.files.filter(f => !f.sample); state.issues = state.issues.filter(i => !i.sample); state.sample = false; if (S().entity.includes("(sample)")) S().entity = ""; state.ui.fileId = null; save(); render(); toast("Sample removed."); }
  else if (a === "sheet"){ state.ui.fileId = t.dataset.file; state.ui.sheet = t.dataset.sheet; save(); render(); }
  else if (a === "del-file"){ const id = t.dataset.file; state.files = state.files.filter(f => f.id !== id); state.issues = state.issues.filter(i => !(i.auto && i.loc.fileId === id)); if (id==="sample") state.sample=false; state.ui.fileId = null; save(); render(); toast("File removed with its automated issues."); }
  else if (a === "goto"){ const i = state.issues.find(x => x.id == t.dataset.id); state.ui.fileId = i.loc.fileId; state.ui.sheet = i.loc.sheet; state.ui.flaggedOnly = false; pendingRow = i.loc.rows[0]; save(); closeDrawer(); if (location.hash === "#files") render(); else location.hash = "files"; }
  else if (a === "save-issue"){
    const i = state.issues.find(x => x.id == t.dataset.id);
    i.status = $("#d-status").value; i.prio = $("#d-prio").value; i.riskOverride = $("#d-risk").value; i.cat = $("#d-cat").value;
    i.amount = num($("#d-amt").value) || 0; i.notes = $("#d-notes").value;
    save(); render(); openIssue(i.id); toast("Issue saved.");
  }
  else if (a === "add-ref"){
    const i = state.issues.find(x => x.id == t.dataset.id), code = $("#ar-code").value;
    const ps = $("#ar-para").value.split(/[,;]/).map(s => s.trim().replace(/^para\s*/i,"")).filter(Boolean);
    const ex = i.refs.find(r => r[0] === code);
    if (ex) ex[1] = [...new Set(ex[1].concat(ps))]; else i.refs.push([code, ps]);
    if (i.auto){ i.extraRefs = i.extraRefs || []; i.extraRefs.push([code, ps]); }
    save(); render(); openIssue(i.id);
  }
  else if (a === "del-ask"){ $("#delZone").innerHTML = `<span class="row"><span class="muted">Delete this issue?</span><button class="btn sm danger" data-act="del" data-id="${t.dataset.id}">Delete</button><button class="btn sm ghost" data-act="del-cancel" data-id="${t.dataset.id}">Keep</button></span>`; }
  else if (a === "del-cancel"){ openIssue(t.dataset.id); }
  else if (a === "del"){ state.issues = state.issues.filter(x => x.id != t.dataset.id); save(); closeDrawer(); render(); toast("Issue deleted."); }
  else if (a === "reset-ask"){ $("#resetZone").innerHTML = `<span class="row"><span class="muted">Remove all files, issues and settings?</span><button class="btn sm danger" type="button" data-act="reset">Clear all</button><button class="btn sm ghost" type="button" data-act="reset-cancel">Cancel</button></span>`; }
  else if (a === "reset-cancel"){ render(); }
  else if (a === "reset"){ state = defaults(); save(); render(); toast("All data cleared. Use Load sample or upload a file to start again."); }
  else if (a === "new") newIssueModal();
  else if (a === "modal-close") $("#modal").classList.remove("open");
  else if (a === "export") exportCsv();
  else if (a === "copy") copyOut(issuesTable("\t"));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeDrawer(); $("#modal").classList.remove("open"); }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("icard")){ e.preventDefault(); openIssue(e.target.dataset.id); }
});
$("#scrim").addEventListener("click", closeDrawer);
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") $("#modal").classList.remove("open"); });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "settingsForm"){
    const s = S();
    s.entity = $("#s-entity").value.trim(); s.fyEnd = $("#s-fy").value; s.currency = $("#s-cur").value.trim() || "SGD";
    s.om = Math.max(0, num($("#s-om").value) || 0); s.pmPct = Math.min(100, Math.max(1, num($("#s-pm").value) || 75)); s.ctPct = Math.min(20, Math.max(0, num($("#s-ct").value) ?? 5));
    retest(); save(); render(); toast("Settings applied. All files re-tested.");
  }
  if (e.target.id === "newIssue"){
    const loc = $("#n-loc").value.split("|"), f = state.files.find(x => x.id === loc[0]);
    const sh = f && f.sheets.find(s => s.name === loc.slice(1).join("|"));
    const ps = $("#n-para").value.split(/[,;]/).map(s => s.trim()).filter(Boolean);
    const i = {id:state.seq++, auto:false, testId:"manual", title:$("#n-title").value.trim(), cat:$("#n-cat").value, wOverride:+$("#n-w").value,
      amount:num($("#n-amt").value) || 0, count:0, detail:$("#n-desc").value.trim(), why:"",
      loc:{fileId:f?f.id:null, fileName:f?f.name:"", sheet:sh?sh.name:"", rows:$("#n-rows").value.split(/[,\s]+/).map(Number).filter(n => n > 0), cols:[]},
      refs: ps.length || $("#n-code").value ? [[$("#n-code").value, ps]] : [], status:"Open", prio:"", notes:"", created:new Date().toISOString()};
    state.issues.push(i); save(); $("#modal").classList.remove("open"); render(); openIssue(i.id); toast(`${issueNo(i)} added.`);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "f-q"){ state.ui.filters.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { save(); const p = e.target.selectionStart; render(); const el = $("#f-q"); el.focus(); el.setSelectionRange(p,p); }, 220); }
});
document.addEventListener("change", e => {
  const id = e.target.id, F = state.ui.filters;
  const m = {"f-risk":"risk","f-cat":"cat","f-status":"status","f-prio":"prio"};
  if (m[id]){ F[m[id]] = e.target.value; save(); render(); }
  if (id === "f-sort"){ state.ui.sort = e.target.value; save(); render(); }
});
$("#fileInput").addEventListener("change", e => handleFiles(e.target.files));
window.addEventListener("hashchange", route);

/* ===================== boot ===================== */
state = load();
if (!state){ state = defaults(); loadSample(); save(); }
state.ui = Object.assign(defaults().ui, state.ui || {});
route();
</script>
</body>
</html>
